name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-types-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project + dev tools
        run: uv sync --extra dev --locked

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Mypy (types)
        run: uv run mypy

      - name: Fast tests
        run: uv run pytest -m "not slow" -q
