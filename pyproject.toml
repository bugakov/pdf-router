[project]
name = "pdf-router"
version = "0.1.0"
description = "Ultra-minimal, deterministic, deploy-anywhere PDF to LLM-ready Markdown router"
readme = "DESIGN.md"
requires-python = ">=3.12"
dependencies = [
    "pdf-inspector>=1.17",
    "pymupdf>=1.27",
]

[project.scripts]
pdf-router = "pdf_router.cli:main"

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3"]
cloud = ["requests>=2.31"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running OCR tests (~20s/page); deselect with -m 'not slow'",
]
