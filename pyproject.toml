[project]
name = "pdf-router"
version = "0.6.2"
description = "Ultra-minimal, deterministic, deploy-anywhere PDF to LLM-ready Markdown router"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12, <3.15"
dependencies = [
    "office-oxide==0.1.12",
    "pdf-inspector>=1.17",
    "pymupdf>=1.27",
]

[project.scripts]
pdf-router = "pdf_router.cli:main"

[project.optional-dependencies]
# ADR-0011: Local neural OCR and layout/table reconstruction.
# rapidocr, lineless/wired table rec and rapid-layout drag in
# opencv-python, scipy, onnxruntime, etc. (~800 MB). The lean router core
# does not carry them — they are opt-in for scanned documents.
ocr-local = [
    "lineless-table-rec==0.1.0",
    "onnxruntime>=1.29.0",
    "rapid-layout>=1.2.1",
    "rapidocr>=3.9.2",
    "wired-table-rec==1.2.0",
]
tesseract = ["pytesseract>=0.3"]
cloud = ["requests>=2.31"]
# ADR-0009: the Docling interchange renderer. docling-core drags in
# pandas/pillow/typer/doclang — the ultra-minimal core must not carry it
# (same argument as ADR-0002 for the DocLang stack), so the renderer is
# opt-in and the import is lazy. The floor is the oldest version the
# renderer was verified against (2.87.0 — the module layout the renderer
# imports; verified on 2.87.0 ... 2.103.1).
docling = ["docling-core>=2.87.0"]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.9",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running OCR tests (~20s/page); deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (incl. E501 line-too-long at 120)
    "W",
    "F",   # pyflakes
    "B",   # bugbear
    "RUF",
]
# RUF001/2/3 off: the corpus and its assertions are Russian; the
# ambiguous-homoglyph warnings fire on every Cyrillic string.
ignore = ["RUF001", "RUF002", "RUF003", "B905", "B023", "RUF012", "RUF059"]

[tool.ruff.lint.per-file-ignores]
# Tests: long docstring URLs / corpus paths and deliberate broad excepts are
# fine; E501 stays off there to avoid churning corpus-anchored docstrings.
"tests/*" = ["E501"]
# Grouped, comment-sectioned `__all__` lists are intentional — do not
# enforce isort ordering there.
"src/pdf_router/__init__.py" = ["RUF022"]
"src/pdf_router/api.py" = ["RUF022"]

[tool.mypy]
python_version = "3.12"
files = ["src/pdf_router"]
# Pragmatic baseline: every source file must type-check, third-party stubs
# are not required (rapidocr/lineless/wired ship no py.typed).
ignore_missing_imports = true
check_untyped_defs = true
