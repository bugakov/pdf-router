name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-ci:
    name: Rust (Format, Clippy, Test, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests
        run: cargo test --workspace --verbose

      - name: Build Release Binary
        run: cargo build --release -p pdf-router-cli

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-router-linux-x86_64
          path: target/release/pdf-router
          if-no-files-found: error

  python-ci:
    name: Python (Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install system tools (djvulibre)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q djvulibre-bin

      - name: Provision .runtime (pdfium + onnxruntime)
        run: |
          mkdir -p .runtime
          curl -fsSL --retry 3 -o /tmp/pdfium.tgz \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7988/pdfium-linux-x64.tgz
          echo "7358c15e26a746cd67854887ea11b3b807c436056788eee9294fb972b8f8e0be  /tmp/pdfium.tgz" | sha256sum -c -
          tar -xzf /tmp/pdfium.tgz -C .runtime
          curl -fsSL --retry 3 -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-x64-1.27.0.tgz
          tar -xzf /tmp/ort.tgz -C .runtime

      - name: Install project + dev tools
        run: uv sync --extra dev --locked

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Mypy (types)
        run: uv run mypy

      - name: Fast tests
        run: uv run pytest -m "not slow" -q

      - name: Install the docling extra
        run: uv sync --extra dev --extra docling --locked

      - name: Docling renderer tests
        run: uv run pytest tests/test_docling_renderer.py -q
